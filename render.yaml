services:
  - type: web
    name: formulaflow-api
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn backend.main:app --workers 1 --worker-class uvicorn_worker.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/formula_requests.db
      - key: FRONTEND_ORIGINS
        value: https://formula-flow-9461.vercel.app/
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_PAYOUT_SIMULATED
        value: "false"
      - key: PICKUP_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
    disk:
      name: formulaflow-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: formulaflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://formulaflow-api.onrender.com
      - key: VITE_PAYPAL_CLIENT_ID
        sync: false
      - key: VITE_AG_STUDIO_LICENSE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
